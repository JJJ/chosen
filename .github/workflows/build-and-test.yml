name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Use Node.js (from .nvmrc)
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build
      run: npm run build
    
    - name: Run tests
      run: npm test
      env:
        CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome

    - name: Install WebKit for touch tests
      run: npx playwright-core install --with-deps webkit

    - name: Run iPad WebKit touch tests
      run: node scripts/run-mobile-webkit.js
